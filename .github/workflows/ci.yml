name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check black formatting
      run: black --check .

    - name: Check import sorting
      run: isort --check-only .

  test:
    needs: lint
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      run: python manage.py migrate

    - name: Run tests
      run: python manage.py test

  build:
    needs: test
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image tag
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
        else
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=${BRANCH}-${SHA}" >> "$GITHUB_ENV"
        fi

    - name: Build Docker image
      run: docker build -t python-app:${{ env.IMAGE_TAG }} .

    - name: Tag Docker image
      run: docker tag python-app:${{ env.IMAGE_TAG }} ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}

    - name: Login to GitHub Container Registry
      run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Push to GitHub Container Registry
      run: docker push ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}

    - name: Run tests in container
      run: docker run --rm python-app:${{ env.IMAGE_TAG }} python manage.py test
